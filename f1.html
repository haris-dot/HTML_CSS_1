<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid Example</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="f1.css">
</head>

<body>

    <div class="container">

        <h1 class="text-center my-4">Bootstrap Grid</h1>

        <div class="row">

            <div class="col">
                Column 1
            </div>

            <div class="col">
                Column 2
            </div>

            <div class="col">
                Column 3
            </div>

        </div>

    </div>

</body>

</html>
